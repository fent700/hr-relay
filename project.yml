name: HealthToGarmin
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  HealthToGarmin:
    type: application
    platform: iOS
    sources: [HealthToGarmin]
    scheme: {}
    info:
      path: HealthToGarmin/Info.plist
      properties:
        CFBundleDisplayName: Health→Garmin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Reads your workouts, routes and heart rate so they can be uploaded to Garmin Connect.
        NSHealthUpdateUsageDescription: This app does not write to Apple Health.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [healthtogarmin.refresh]
    entitlements:
      path: HealthToGarmin/HealthToGarmin.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthtogarmin
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
