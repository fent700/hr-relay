name: HRRelay
options:
  bundleIdPrefix: com.hrrelay
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# Declared explicitly: Xcode's auto-created scheme lives in xcuserdata, which a
# fresh CI checkout doesn't have.
schemes:
  HRRelay:
    build:
      targets:
        HRRelay: all
    run:
      config: Debug
    archive:
      config: Release
  HRRelayWatch:
    build:
      targets:
        HRRelayWatch: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HRRelay:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrrelay.app
        PRODUCT_NAME: HRRelay
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HRRelay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Single-target watch app (watchOS 7+ format). Built for armv7k as well as
  # arm64_32: Series 3 is armv7k. CI copies it into HRRelay.app/Watch/.
  HRRelayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: WatchSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrrelay.app.watchkitapp
        PRODUCT_NAME: HRRelayWatch
        INFOPLIST_FILE: Support/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HRRelay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "armv7k arm64_32"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
