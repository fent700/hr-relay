name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The iPhone workout session API needs the iOS 26+ SDK.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project HRRelay.xcodeproj

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRRelay.xcodeproj \
            -scheme HRRelay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build.log

      - name: Surface compiler errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E ': error: ' build.log | sort -u | head -40 | \
            sed -E "s#^${GITHUB_WORKSPACE}/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)\$#::error file=\1,line=\2,col=\3::\4#" || true

      - name: Package Payload/ into HRRelay.ipa
        run: |
          chmod +x Scripts/package.sh
          ./Scripts/package.sh

      - name: Confirm the archive is clean
        run: |
          unzip -l HRRelay.ipa | tail -3
          if unzip -l HRRelay.ipa | grep -q -e '_CodeSignature' -e '__MACOSX'; then
            echo "error: archive carries a signature bundle or resource forks."
            exit 1
          fi
          mv HRRelay.ipa "HRRelay-${{ github.run_number }}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HRRelay-ipa-${{ github.run_number }}
          path: HRRelay-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 30
